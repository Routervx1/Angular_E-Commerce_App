<header class="site-header">
  <a class="brand" routerLink="/">
    <span class="brand-emoji">🐾</span>
    <span class="brand-name">V's Pet Store</span>
  </a>

  <nav class="site-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Shop</a>
    <a routerLink="/cart" routerLinkActive="active">Cart</a>
  </nav>

  <a class="cart-pill" routerLink="/cart" aria-label="View cart">
    <span class="cart-icon">🛒</span>
    @if (itemCount() > 0) {
      <span class="cart-badge">{{ itemCount() }}</span>
    }
  </a>
</header>
